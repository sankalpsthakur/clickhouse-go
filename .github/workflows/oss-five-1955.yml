name: Issue 1955 named parameter validation
on:
  push:
    branches: [validation/issue-1955-20260918]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'sankalpsthakur/clickhouse-go'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLICKHOUSE_VERSION: 26.3.33.24
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sankalpsthakur/clickhouse-go
          ref: c37b81ff305c5fe8ab8511fb009504aec46957e0
          path: source
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache-dependency-path: source/go.sum
      - name: Prepare regression tests
        working-directory: source
        run: |
          mkdir -p ../evidence
          python3 ../validation/tools/oss-five/prepare_1955.py tests
          git diff --check
          go mod download
      - name: Start ClickHouse
        working-directory: source
        run: make up
      - name: Require failures before fix
        working-directory: source
        run: |
          set +e
          go test -race -count=1 -v -run '^TestBindNamedDollar$' . > ../evidence/before-unit.log 2>&1
          status=$?
          set -e
          cat ../evidence/before-unit.log
          test "$status" -ne 0
          grep -q -- '--- FAIL: TestBindNamedDollar/' ../evidence/before-unit.log
          set +e
          go test -race -count=1 -v -run '^Test1955$' ./tests/issues > ../evidence/before-integration.log 2>&1
          status=$?
          set -e
          cat ../evidence/before-integration.log
          test "$status" -ne 0
          grep -Eq 'have no arg for|SYNTAX_ERROR|Syntax error' ../evidence/before-integration.log
      - name: Apply fix and verify regression
        working-directory: source
        run: |
          set -o pipefail
          python3 ../validation/tools/oss-five/prepare_1955.py fix
          go test -race -count=1 -v -run '^TestBindNamedDollar$' . 2>&1 | tee ../evidence/after-unit.log
          go test -race -count=1 -v -run '^Test1955$' ./tests/issues 2>&1 | tee ../evidence/after-integration.log
          ! grep -q -- '--- SKIP: Test1955' ../evidence/after-integration.log
      - name: Full race test suite and lint
        working-directory: source
        run: |
          set -o pipefail
          make test 2>&1 | tee ../evidence/full-tests.log
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.0
          golangci-lint run 2>&1 | tee ../evidence/lint.log
          git diff --check
      - name: Publish validated source changes
        working-directory: source
        run: |
          git add bind.go bind_named_dollar_test.go tests/issues/issue_1955_test.go
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git diff --cached > ../evidence/issue-1955.patch
          git -c user.name='Sankalp Thakur' -c user.email='31366524+sankalpsthakur@users.noreply.github.com' commit -m 'fix: bind complete named parameters containing dollar signs'
          git push origin HEAD:refs/heads/fix/issue-1955-named-dollar
          git rev-parse HEAD | tee ../evidence/commit.txt
      - name: Check compatibility with the separate heredoc fix
        working-directory: source
        run: |
          set -o pipefail
          git fetch --depth=2 origin ead0b0cec60f4b5928416449c61e3bb3e242d410
          git -c user.name='Sankalp Thakur' -c user.email='31366524+sankalpsthakur@users.noreply.github.com' cherry-pick ead0b0cec60f4b5928416449c61e3bb3e242d410
          go test -race -count=1 -v -run 'TestBindHeredoc|TestBindNamedDollar' . 2>&1 | tee ../evidence/combined-unit.log
          go test -race -count=1 -v -run '^Test195[15]$' ./tests/issues 2>&1 | tee ../evidence/combined-integration.log
          golangci-lint run 2>&1 | tee ../evidence/combined-lint.log
      - name: Stop ClickHouse
        if: always()
        working-directory: source
        run: make down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1955-evidence
          path: evidence/
          retention-days: 14
