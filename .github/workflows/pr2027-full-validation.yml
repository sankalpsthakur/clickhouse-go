name: PR 2027 exact-head full validation
on:
  push:
    branches: [validation/pr2027-full-suite-20260917]
    paths: [.github/workflows/pr2027-full-validation.yml]
permissions:
  contents: read
concurrency:
  group: pr2027-full-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'sankalpsthakur/clickhouse-go'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ['25.12.11.4', '26.3.33.24']
    env:
      CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
      CLICKHOUSE_USE_DOCKER: 'true'
      CLICKHOUSE_TEST_TIMEOUT: 1200s
    defaults:
      run:
        shell: bash
        working-directory: driver
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: sankalpsthakur/clickhouse-go
          ref: d957ab447b6c99e1a1516b51aa1d10c7f747b32b
          path: driver
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25'
          cache: false
      - name: Record exact source and available resources
        run: |
          set -euo pipefail
          mkdir -p ../logs
          test "$(git rev-parse HEAD)" = d957ab447b6c99e1a1516b51aa1d10c7f747b32b
          { git rev-parse HEAD; go version; docker version; free -m; } 2>&1 | tee ../logs/environment.txt
          make fmt-check
          git diff --check
      - name: Real-server protocol-retirement regression, ten race-enabled repetitions
        timeout-minutes: 12
        run: |
          set -euo pipefail
          go test -race -count=10 -timeout 10m -v ./tests/issues -run '^TestIssue1988$' 2>&1 | tee ../logs/1988-regression.log
          test "$(grep -c -- '--- PASS: TestIssue1988 (' ../logs/1988-regression.log)" -eq 10
          if grep -E 'Skipping (IT )?tests|--- SKIP:' ../logs/1988-regression.log; then exit 1; fi
      - name: Complete repository race suite
        timeout-minutes: 25
        run: |
          set -euo pipefail
          make test 2>&1 | tee ../logs/full-suite.log
          if grep -E 'Skipping (IT )?tests' ../logs/full-suite.log; then exit 1; fi
          grep -E '^ok[[:space:]]+github.com/ClickHouse/clickhouse-go/v2/tests/issues' ../logs/full-suite.log
          grep -E '^ok[[:space:]]+github.com/ClickHouse/clickhouse-go/v2/tests/std' ../logs/full-suite.log
          grep -F -- '--- PASS: TestIssue1988 (' ../logs/full-suite.log
      - name: Run linter directly without the Makefile error suppression
        timeout-minutes: 12
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.0
          "$(go env GOPATH)/bin/golangci-lint" version 2>&1 | tee ../logs/lint-version.log
          "$(go env GOPATH)/bin/golangci-lint" run 2>&1 | tee ../logs/lint.log
      - name: Capture Docker diagnostics
        if: always()
        run: |
          mkdir -p ../logs
          docker ps -a > ../logs/docker-containers.txt
          docker stats --no-stream > ../logs/docker-resources.txt || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2027-logs-${{ matrix.clickhouse }}
          path: logs/
          if-no-files-found: error
          retention-days: 14
