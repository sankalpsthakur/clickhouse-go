name: Race unit validate

# Fork-only validation for the fix-1988 branches. Not part of any upstream PR.
on:
  push:
    branches:
      - ci-validate-2027
      - ci-validate-2027-failbefore
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.27"
          - "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Race unit tests
        env:
          GOTOOLCHAIN: "local"
        run: |
          go test -race -count=5 -v -run 'TestQueryDeadlineRetiresConnectionWithoutRace|TestQueryProtocolErrorRetiresConnection' .

  lint:
    # Upstream lint runs on a self-hosted runner, so repeat it here with the same version.
    if: github.ref_name == 'ci-validate-2027'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
